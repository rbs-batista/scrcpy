<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrcpy Fake GPS</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a14;
            color: #e0e0e0;
            height: 100vh;
            overflow: hidden;
        }

        .app-layout {
            display: flex;
            height: 100vh;
        }

        /* ===== Map Side Panel (left) ===== */
        .map-panel {
            width: 420px;
            min-width: 220px;
            background: #1a1a2e;
            display: flex;
            flex-direction: column;
            position: relative;
            flex-shrink: 0;
            overflow: hidden;
        }

        .map-panel.hidden {
            display: none;
        }

        .resizer {
            width: 6px;
            background: #1e1e35;
            cursor: col-resize;
            flex-shrink: 0;
            transition: background 0.15s;
        }

        .resizer:hover,
        .resizer.dragging {
            background: #42a5f5;
        }

        .resizer.hidden {
            display: none;
        }

        .map-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            background: linear-gradient(135deg, #16213e 0%, #1a1a2e 100%);
            border-bottom: 1px solid #2a2a4a;
        }

        .map-header h3 {
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .map-controls {
            padding: 10px 14px;
            background: #16213e;
            border-bottom: 1px solid #2a2a4a;
        }

        #map {
            flex: 1;
            min-height: 0;
        }

        /* ===== Main: Device (right) ===== */
        .device-main {
            flex: 1;
            min-width: 200px;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px;
            background: linear-gradient(135deg, #0f0f1f 0%, #1a1a2e 100%);
            border-bottom: 1px solid #2a2a4a;
            z-index: 10;
        }

        .top-bar h1 {
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .top-bar-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .device-screen {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            position: relative;
            overflow: hidden;
            min-height: 0;
        }

        .device-screen img,
        .device-screen canvas {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            cursor: pointer;
            user-select: none;
            -webkit-user-drag: none;
            display: none;
        }

        .device-placeholder {
            text-align: center;
            color: #444;
            padding: 40px;
        }

        .device-placeholder .icon {
            font-size: 64px;
            margin-bottom: 16px;
        }

        .device-placeholder h3 {
            font-size: 18px;
            color: #666;
            margin-bottom: 8px;
        }

        .device-placeholder p {
            font-size: 13px;
            line-height: 1.6;
            color: #555;
        }

        .touch-indicator {
            position: absolute;
            width: 30px;
            height: 30px;
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            pointer-events: none;
            transform: translate(-50%, -50%);
            animation: touchFade 0.4s ease-out forwards;
        }

        @keyframes touchFade {
            0% {
                transform: translate(-50%, -50%) scale(0.5);
                opacity: 1;
            }

            100% {
                transform: translate(-50%, -50%) scale(1.5);
                opacity: 0;
            }
        }

        .nav-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 8px 20px;
            background: #0f0f1f;
            border-top: 1px solid #2a2a4a;
        }

        /* ===== Buttons ===== */
        button {
            padding: 7px 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            font-weight: 500;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            white-space: nowrap;
        }

        button:hover {
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4caf50, #2e7d32);
            color: white;
        }

        .btn-danger {
            background: linear-gradient(135deg, #f44336, #c62828);
            color: white;
        }

        .btn-blue {
            background: linear-gradient(135deg, #2196F3, #1565C0);
            color: white;
        }

        .btn-ghost {
            background: rgba(255, 255, 255, 0.08);
            color: #ccc;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .btn-ghost:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
        }

        .btn-ghost.active {
            background: rgba(33, 150, 243, 0.2);
            color: #42a5f5;
            border-color: rgba(33, 150, 243, 0.4);
        }

        .btn-nav {
            padding: 8px 24px;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.06);
            color: #888;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
        }

        .btn-nav:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
        }

        .btn-sm {
            padding: 5px 10px;
            font-size: 11px;
        }

        .btn-group {
            display: flex;
            gap: 6px;
        }

        /* Status indicators */
        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 500;
        }

        .status-pill.off {
            background: rgba(244, 67, 54, 0.15);
            color: #ef5350;
        }

        .status-pill.on {
            background: rgba(76, 175, 80, 0.15);
            color: #66bb6a;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .status-pill.off .status-dot {
            background: #f44336;
        }

        .status-pill.on .status-dot {
            background: #4caf50;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.4;
            }
        }

        .map-info {
            font-size: 11px;
            color: #888;
            margin-bottom: 6px;
        }

        .map-info span {
            color: #66bb6a;
            font-weight: 500;
        }

        .loc-info {
            font-size: 10px;
            color: #666;
            margin-top: 6px;
        }

        /* ===== Map Search ===== */
        .map-search {
            position: relative;
            margin-bottom: 8px;
        }

        .map-search-icon {
            position: absolute;
            left: 8px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 12px;
            color: #555;
            pointer-events: none;
        }

        .map-search input {
            width: 100%;
            padding: 6px 8px 6px 26px;
            background: #0f0f1f;
            border: 1px solid #2a2a4a;
            border-radius: 6px;
            color: #e0e0e0;
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            outline: none;
            transition: border-color 0.2s;
        }

        .map-search input:focus {
            border-color: #42a5f5;
        }

        .map-search input::placeholder {
            color: #444;
        }

        .map-search-results {
            display: none;
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            right: 0;
            background: #1a1a2e;
            border: 1px solid #2a2a4a;
            border-radius: 6px;
            z-index: 1000;
            max-height: 200px;
            overflow-y: auto;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .map-search-result {
            padding: 7px 10px;
            font-size: 11px;
            cursor: pointer;
            color: #bbb;
            border-bottom: 1px solid #1e1e35;
            line-height: 1.4;
        }

        .map-search-result:last-child {
            border-bottom: none;
        }

        .map-search-result:hover {
            background: rgba(33, 150, 243, 0.12);
            color: #fff;
        }

        .map-search-result strong {
            display: block;
            font-size: 12px;
            color: #e0e0e0;
        }

        /* ===== Devices Overlay (inside device-screen, right side) ===== */
        .devices-overlay {
            position: absolute;
            right: 8px;
            top: 8px;
            bottom: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            z-index: 10;
            pointer-events: none;
        }

        .devices-overlay>* {
            pointer-events: auto;
        }

        #devices-list {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            overflow-y: auto;
            flex: 1;
            padding: 2px;
            pointer-events: none;
        }

        .phone-card-wrapper {
            pointer-events: auto;
        }

        #devices-list::-webkit-scrollbar {
            width: 0;
        }

        .phone-card-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .phone-card {
            width: 60px;
            height: 100px;
            border-radius: 10px;
            border: 2px solid #2a2a4a;
            background: #16213e;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: border-color 0.2s, box-shadow 0.2s, transform 0.15s;
            flex-shrink: 0;
        }

        /* Phone speaker */
        .phone-card::before {
            content: '';
            position: absolute;
            top: 8px;
            width: 18px;
            height: 3px;
            background: #2a2a4a;
            border-radius: 2px;
            z-index: 1;
        }

        /* Phone home button */
        .phone-card::after {
            content: '';
            position: absolute;
            bottom: 7px;
            width: 10px;
            height: 10px;
            border: 2px solid #2a2a4a;
            border-radius: 50%;
            z-index: 1;
        }

        .phone-bg-icon {
            font-size: 44px;
            opacity: 0.1;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            user-select: none;
            line-height: 1;
        }

        .phone-card:hover {
            border-color: #42a5f5;
            transform: scale(1.06);
        }

        .phone-card.selected {
            border-color: #42a5f5;
            background: rgba(33, 150, 243, 0.12);
            box-shadow: 0 0 10px rgba(66, 165, 245, 0.35);
        }

        .phone-card.selected::before {
            background: #42a5f5;
        }

        .phone-card.selected::after {
            border-color: #42a5f5;
        }

        .phone-card.running {
            border-color: #66bb6a;
            box-shadow: 0 0 10px rgba(102, 187, 106, 0.4);
            animation: runningPulse 2s infinite;
        }

        @keyframes runningPulse {

            0%,
            100% {
                box-shadow: 0 0 8px rgba(102, 187, 106, 0.4);
            }

            50% {
                box-shadow: 0 0 18px rgba(102, 187, 106, 0.7);
            }
        }

        .phone-card.unavailable {
            opacity: 0.4;
            cursor: default;
        }

        .phone-card.unavailable:hover {
            transform: none;
            border-color: #2a2a4a;
        }

        .phone-card-label {
            font-size: 8px;
            font-weight: 600;
            color: #888;
            text-align: center;
            max-width: 72px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .phone-card.selected~.phone-card-label,
        .phone-card.running~.phone-card-label {
            color: #ccc;
        }

        /* Tooltip — aparece à esquerda pois os cards ficam na borda direita */
        .phone-tooltip {
            display: none;
            position: absolute;
            right: calc(100% + 10px);
            top: 50%;
            transform: translateY(-50%);
            background: #1a1a2e;
            border: 1px solid #2a2a4a;
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 11px;
            white-space: nowrap;
            z-index: 200;
            pointer-events: none;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            line-height: 1.7;
        }

        .phone-card:hover .phone-tooltip {
            display: block;
        }

        .phone-tooltip-row {
            color: #888;
        }

        .phone-tooltip-row span {
            color: #e0e0e0;
        }

        .phone-tooltip-row.ip span {
            color: #66bb6a;
        }

        .devices-refresh-btn {
            font-size: 13px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #555;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 6px;
            transition: color 0.2s, background 0.2s;
            flex-shrink: 0;
        }

        .devices-refresh-btn:hover {
            color: #aaa;
            background: rgba(255, 255, 255, 0.12);
            transform: none;
        }
    </style>
</head>

<body>
    <div class="app-layout">

        <!-- Left Panel: Map -->
        <div class="map-panel hidden" id="map-panel">
            <div class="map-header">
                <h3>🗺 Fake GPS</h3>
                <div class="btn-group">
                    <button id="btn-map-maximize" class="btn-ghost btn-sm" title="Maximizar mapa">⛶</button>
                    <button id="btn-map-close" class="btn-ghost btn-sm" title="Fechar">✕</button>
                </div>
            </div>
            <div class="map-controls">
                <div class="map-search">
                    <span class="map-search-icon">🔍</span>
                    <input id="map-search-input" type="text" placeholder="Buscar cidade ou endereço...">
                    <div class="map-search-results" id="map-search-results"></div>
                </div>
                <div class="map-info">Location: <span id="status">Ready</span></div>
                <div class="btn-group">
                    <button id="btn-mode" class="btn-blue btn-sm">📍 Route Mode</button>
                    <button id="btn-clear" class="btn-danger btn-sm">🗑 Clear</button>
                </div>
                <button id="btn-start-route" class="btn-primary btn-sm"
                    style="display:none; width:100%; margin-top:6px;">▶ Start Route</button>
                <button id="btn-stop-route" class="btn-danger btn-sm"
                    style="display:none; width:100%; margin-top:6px;">⏹ Stop Route</button>
                <div class="loc-info">Click map to set fake location</div>
            </div>
            <div id="map"></div>
        </div>

        <!-- Drag resizer -->
        <div class="resizer hidden" id="resizer"></div>

        <!-- Right: Device Screen -->
        <div class="device-main">
            <div class="top-bar">
                <div style="display:flex;align-items:center;gap:8px;">
                    <h1>📱</h1>
                    <span id="active-device-label" style="font-size:12px;color:#42a5f5;"></span>
                </div>
                <div class="top-bar-actions">
                    <div id="scrcpy-status" class="status-pill off">
                        <div class="status-dot"></div>
                        <span>Stopped</span>
                    </div>
                    <button id="btn-map-toggle" class="btn-ghost">🗺 Map</button>
                </div>
            </div>

            <div class="device-screen" id="device-screen">
                <div class="device-placeholder" id="placeholder">
                    <div class="icon">📱</div>
                    <h3>No device connected</h3>
                    <p>Selecione um device para conectar</p>
                </div>
                <canvas id="stream-canvas" style="display:none;"></canvas>
                <img id="stream-img" src="" alt="Device Screen" style="display:none;">

                <!-- Devices overlay (right side of the black area) -->
                <div class="devices-overlay" id="devices-overlay">
                    <div id="devices-list"></div>
                    <button class="devices-refresh-btn" id="btn-devices-refresh" title="Atualizar">↻</button>
                </div>
            </div>

            <div class="nav-bar">
                <button id="btn-back" class="btn-nav">◀</button>
                <button id="btn-home" class="btn-nav">●</button>
                <button id="btn-recent" class="btn-nav">■</button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script>
        // ========== Map Panel Toggle ==========
        const mapPanel = document.getElementById('map-panel');
        const resizer = document.getElementById('resizer');
        const btnMapToggle = document.getElementById('btn-map-toggle');
        const btnMapClose = document.getElementById('btn-map-close');
        const btnMapMaximize = document.getElementById('btn-map-maximize');
        let mapInitialized = false;
        let leafletMap = null;
        let mapMaximized = false;
        let appConfig = { window: { phone_width: 420, phone_height: 920, map_panel_width: 420, map_open_width: 0, map_open_height: 0 } };
        let savedMapWidth = appConfig.window.map_panel_width;
        let DEFAULT_MAP_WIDTH = appConfig.window.map_panel_width;
        const MAX_MAP_WIDTH = () => Math.round(window.innerWidth * 0.70);

        let phoneSize = { width: 0, height: 0 };
        fetch('/window/phone-size').then(r => r.json()).then(d => { phoneSize = d; });
        fetch('/config').then(r => r.json()).then(cfg => {
            appConfig = cfg;
            DEFAULT_MAP_WIDTH = cfg.window.map_panel_width || 420;
            savedMapWidth = DEFAULT_MAP_WIDTH;
        });

        function resizeWindow(width, height) {
            fetch('/window/resize', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ width, height })
            });
        }

        function toggleMap() {
            const isVisible = !mapPanel.classList.contains('hidden');

            if (isVisible) {
                savedMapWidth = mapPanel.offsetWidth;
                mapPanel.classList.add('hidden');
                resizer.classList.add('hidden');
                btnMapToggle.classList.remove('active');
                mapMaximized = false;
                btnMapMaximize.textContent = '⛶';
                btnMapMaximize.title = 'Maximizar mapa';
                if (phoneSize.width) resizeWindow(phoneSize.width, phoneSize.height);
            } else {
                const openW = appConfig.window.map_open_width || screen.availWidth;
                const openH = appConfig.window.map_open_height || screen.availHeight;
                resizeWindow(openW, openH);
                mapPanel.style.width = savedMapWidth + 'px';
                mapPanel.classList.remove('hidden');
                resizer.classList.remove('hidden');
                btnMapToggle.classList.add('active');

                if (!mapInitialized) {
                    setTimeout(() => {
                        leafletMap = L.map('map').setView([-23.5505, -46.6333], 13);
                        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                            attribution: '&copy; OSM'
                        }).addTo(leafletMap);
                        setupMapInteractions();
                        mapInitialized = true;
                    }, 100);
                } else if (leafletMap) {
                    setTimeout(() => leafletMap.invalidateSize(), 50);
                }
            }
        }

        function toggleMaximize() {
            if (mapPanel.classList.contains('hidden')) return;
            mapMaximized = !mapMaximized;
            mapPanel.style.width = (mapMaximized ? MAX_MAP_WIDTH() : DEFAULT_MAP_WIDTH) + 'px';
            btnMapMaximize.textContent = mapMaximized ? '⊡' : '⛶';
            btnMapMaximize.title = mapMaximized ? 'Restaurar tamanho' : 'Maximizar mapa';
            if (leafletMap) setTimeout(() => leafletMap.invalidateSize(), 50);
        }

        btnMapToggle.addEventListener('click', toggleMap);
        btnMapClose.addEventListener('click', toggleMap);
        btnMapMaximize.addEventListener('click', toggleMaximize);

        // ========== Devices Column ==========
        const devicesList = document.getElementById('devices-list');
        const btnDevicesRefresh = document.getElementById('btn-devices-refresh');
        const activeDeviceLabel = document.getElementById('active-device-label');
        let selectedSerial = '';
        let cachedDevices = [];

        function abbreviateModel(model) {
            if (!model) return '?';
            // keep first 2 words max, truncate to 10 chars
            const words = model.trim().split(/\s+/).slice(0, 2).join(' ');
            return words.length > 12 ? words.slice(0, 11) + '…' : words;
        }

        async function loadDevices(silent = false) {
            if (!silent) {
                devicesList.innerHTML = '<span style="font-size:9px;color:#444;text-align:center;padding:4px;">...</span>';
            }
            try {
                const res = await fetch('/devices');
                const devices = await res.json();
                const signature = devices.map(d => d.serial + d.state).join(',');
                const prevSignature = cachedDevices.map(d => d.serial + d.state).join(',');
                if (!silent || signature !== prevSignature) {
                    cachedDevices = devices;
                    renderDevices(cachedDevices);
                }
            } catch (e) {
                if (!silent) {
                    devicesList.innerHTML = '<span style="font-size:9px;color:#555;text-align:center;padding:4px;">Erro</span>';
                }
            }
        }

        function renderDevices(devices) {
            devicesList.innerHTML = '';
            if (!devices || devices.length === 0) {
                devicesList.innerHTML = '<span style="font-size:9px;color:#444;text-align:center;padding:4px 8px;line-height:1.5;">Nenhum device</span>';
                return;
            }
            devices.forEach(d => {
                const isSelected = d.serial === selectedSerial;
                const isRunning = isSelected && scrcpyRunning;
                const available = d.state === 'device';
                const stateColor = d.state === 'device' ? '#66bb6a' : d.state === 'unauthorized' ? '#ffa726' : '#ef5350';

                const wrapper = document.createElement('div');
                wrapper.className = 'phone-card-wrapper';

                const card = document.createElement('div');
                let cardClass = 'phone-card';
                if (!available) cardClass += ' unavailable';
                else if (isRunning) cardClass += ' selected running';
                else if (isSelected) cardClass += ' selected';
                card.className = cardClass;

                card.innerHTML = `
                    <div class="phone-tooltip">
                        <div class="phone-tooltip-row">Modelo: <span>${d.model || '—'}</span></div>
                        <div class="phone-tooltip-row">Serial: <span style="font-family:monospace">${d.serial}</span></div>
                        <div class="phone-tooltip-row">Estado: <span style="color:${stateColor}">${d.state}</span></div>
                        ${d.ip ? `<div class="phone-tooltip-row ip">IP: <span>${d.ip}</span></div>` : ''}
                        ${isRunning ? `<div class="phone-tooltip-row">Scrcpy: <span style="color:#66bb6a">● rodando</span></div>` : ''}
                    </div>
                `;

                const label = document.createElement('span');
                label.className = 'phone-card-label';
                label.textContent = abbreviateModel(d.model || d.serial);

                if (available) wrapper.addEventListener('click', () => selectDevice(d));
                wrapper.appendChild(card);
                wrapper.appendChild(label);
                devicesList.appendChild(wrapper);
            });
        }

        let selectionId = 0;

        async function selectDevice(d) {
            const myId = ++selectionId;

            // Same device clicked → deselect (stream keeps running in background)
            if (d.serial === selectedSerial) {
                selectedSerial = '';
                activeDeviceLabel.textContent = '';
                await fetch('/devices/select', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ serial: '' })
                }).catch(() => { });
                updateScrcpyUI(false, false);
                renderDevices(cachedDevices);
                return;
            }

            // Switch to different device — just update selection, no stop/start needed
            await fetch('/devices/select', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ serial: d.serial })
            }).catch(() => { });
            if (myId !== selectionId) return;

            selectedSerial = d.serial;
            activeDeviceLabel.textContent = (d.model || d.serial);

            // If already pre-connected, stream appears instantly
            await checkScrcpyStatus();
            renderDevices(cachedDevices);

            // Fallback: device still connecting — nudge the backend and poll up to 8s
            if (!scrcpyRunning) {
                fetch('/scrcpy/start', { method: 'POST' }).catch(() => { });
                const deadline = Date.now() + 8000;
                while (Date.now() < deadline) {
                    await new Promise(r => setTimeout(r, 200));
                    if (myId !== selectionId) return;
                    const res = await fetch('/scrcpy/status').catch(() => null);
                    if (!res) continue;
                    const data = await res.json().catch(() => null);
                    if (data?.streaming) {
                        await checkScrcpyStatus();
                        renderDevices(cachedDevices);
                        break;
                    }
                }
            }
        }

        btnDevicesRefresh.addEventListener('click', () => loadDevices());
        // Initial load + auto-connect to first available device
        (async () => {
            await loadDevices();
            if (selectedSerial === '') {
                const first = cachedDevices.find(d => d.state === 'device');
                if (first) selectDevice(first);
            }
        })();
        setInterval(() => loadDevices(true), 5000);

        // ========== Drag Resizer ==========
        resizer.addEventListener('pointerdown', (e) => {
            resizer.setPointerCapture(e.pointerId);
            resizer.classList.add('dragging');
            mapPanel.style.transition = 'none';
            e.preventDefault();
        });

        resizer.addEventListener('pointermove', (e) => {
            if (!resizer.hasPointerCapture(e.pointerId)) return;
            const minMap = 220;
            const minDevice = 200;
            const maxMap = window.innerWidth - minDevice - resizer.offsetWidth;
            mapPanel.style.width = Math.min(Math.max(e.clientX, minMap), maxMap) + 'px';
        });

        resizer.addEventListener('pointerup', (e) => {
            resizer.releasePointerCapture(e.pointerId);
            resizer.classList.remove('dragging');
            mapPanel.style.transition = '';
            if (leafletMap) leafletMap.invalidateSize();
        });

        // ========== State ==========
        let marker = null;
        let routeMarkers = [];
        let polyline = null;
        let routeMode = false;
        let routingInterval = null;
        let currentLat = null;
        let currentLng = null;
        let scrcpyRunning = false;

        const btnMode = document.getElementById('btn-mode');
        const btnStartRoute = document.getElementById('btn-start-route');
        const btnStopRoute = document.getElementById('btn-stop-route');
        const btnClear = document.getElementById('btn-clear');
        const statusEl = document.getElementById('status');
        const streamImg = document.getElementById('stream-img');
        const streamCanvas = document.getElementById('stream-canvas');
        const placeholder = document.getElementById('placeholder');
        const ctx = streamCanvas.getContext('2d');

        function setStatus(msg) { statusEl.innerText = msg; }

        // ========== WebSocket + WebCodecs (primary, low-latency) ==========
        let videoWs = null;
        let videoDecoder = null;
        const hasWebCodecs = typeof VideoDecoder !== 'undefined';

        function parseSPSCodec(data) {
            for (let i = 0; i < data.length - 5; i++) {
                if (data[i] === 0 && data[i + 1] === 0) {
                    let hLen = 0;
                    if (i + 3 < data.length && data[i + 2] === 0 && data[i + 3] === 1) hLen = 4;
                    else if (data[i + 2] === 1) hLen = 3;
                    if (hLen > 0 && (data[i + hLen] & 0x1F) === 7 && i + hLen + 3 < data.length) {
                        const p = data[i + hLen + 1], c = data[i + hLen + 2], l = data[i + hLen + 3];
                        return `avc1.${p.toString(16).padStart(2, '0')}${c.toString(16).padStart(2, '0')}${l.toString(16).padStart(2, '0')}`;
                    }
                }
            }
            return 'avc1.640028';
        }

        function stopVideoWS() {
            if (videoDecoder) {
                try { videoDecoder.close(); } catch (e) { }
                videoDecoder = null;
            }
            if (videoWs) {
                videoWs.onclose = null;
                videoWs.close();
                videoWs = null;
            }
        }

        function startVideoWS() {
            stopVideoWS();
            if (!hasWebCodecs) { startFramePoll(); return; }

            videoDecoder = new VideoDecoder({
                output: (frame) => {
                    if (streamCanvas.width !== frame.displayWidth || streamCanvas.height !== frame.displayHeight) {
                        streamCanvas.width = frame.displayWidth;
                        streamCanvas.height = frame.displayHeight;
                    }
                    ctx.drawImage(frame, 0, 0);
                    frame.close();
                },
                error: (e) => { console.error('VideoDecoder:', e); videoDecoder = null; }
            });

            videoWs = new WebSocket(`ws://${location.host}/ws/video`);
            videoWs.binaryType = 'arraybuffer';

            videoWs.onmessage = (e) => {
                if (!videoDecoder || videoDecoder.state === 'closed') return;
                const data = new Uint8Array(e.data);
                if (data.length < 2) return;
                const isKey = data[0] === 0x01;
                const nalData = data.buffer.slice(1);

                if (isKey && videoDecoder.state === 'unconfigured') {
                    videoDecoder.configure({
                        codec: parseSPSCodec(data.slice(1)),
                        optimizeForLatency: true,
                        hardwareAcceleration: 'prefer-hardware'
                    });
                }
                if (videoDecoder.state !== 'configured') return;

                videoDecoder.decode(new EncodedVideoChunk({
                    type: isKey ? 'key' : 'delta',
                    timestamp: performance.now() * 1000,
                    data: nalData
                }));
            };

            videoWs.onerror = () => { if (!scrcpyRunning) return; startFramePoll(); };
            videoWs.onclose = () => {
                if (scrcpyRunning) setTimeout(startVideoWS, 1000);
            };
        }

        // ========== MJPEG frame polling (fallback when WebCodecs unavailable) ==========
        let framePollTimer = null;
        let currentFrameUrl = null;

        function startFramePoll() {
            stopFramePoll();
            (async function poll() {
                if (!scrcpyRunning) return;
                try {
                    const res = await fetch('/frame');
                    if (res.ok) {
                        const blob = await res.blob();
                        const url = URL.createObjectURL(blob);
                        streamImg.src = url;
                        if (currentFrameUrl) URL.revokeObjectURL(currentFrameUrl);
                        currentFrameUrl = url;
                    }
                } catch { }
                if (scrcpyRunning) framePollTimer = setTimeout(poll, 33);
            })();
        }

        function stopFramePoll() {
            if (framePollTimer) { clearTimeout(framePollTimer); framePollTimer = null; }
            if (currentFrameUrl) { URL.revokeObjectURL(currentFrameUrl); currentFrameUrl = null; }
        }

        // ========== Scrcpy Control ==========
        function updateScrcpyUI(running, streaming) {
            scrcpyRunning = running;
            const statusBar = document.getElementById('scrcpy-status');
            if (running) {
                statusBar.innerHTML = '<div class="status-dot"></div><span>Running</span>';
                statusBar.className = 'status-pill on';
            } else {
                statusBar.innerHTML = '<div class="status-dot"></div><span>Stopped</span>';
                statusBar.className = 'status-pill off';
            }

            if (streaming) {
                placeholder.style.display = 'none';
                if (hasWebCodecs) {
                    streamCanvas.style.display = 'block';
                    streamImg.style.display = 'none';
                    if (!videoWs || videoWs.readyState > WebSocket.OPEN) startVideoWS();
                } else {
                    streamImg.style.display = 'block';
                    streamCanvas.style.display = 'none';
                    startFramePoll();
                }
            } else {
                stopVideoWS();
                stopFramePoll();
                streamCanvas.style.display = 'none';
                streamImg.src = '';
                streamImg.style.display = 'none';
                placeholder.style.display = 'block';
            }
        }

        async function checkScrcpyStatus() {
            try {
                const res = await fetch('/scrcpy/status');
                const data = await res.json();
                updateScrcpyUI(data.running, data.streaming);
            } catch (e) { }
        }

        setInterval(checkScrcpyStatus, 3000);
        checkScrcpyStatus();

        // ========== Location ==========
        async function sendLocation(lat, lng) {
            currentLat = lat;
            currentLng = lng;
            try {
                const res = await fetch('/location', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ lat, lng })
                });
                if (res.ok) setStatus(`${lat.toFixed(5)}, ${lng.toFixed(5)}`);
            } catch (e) { }
        }

        setInterval(() => {
            if (!routingInterval && currentLat !== null && currentLng !== null) {
                fetch('/location', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ lat: currentLat, lng: currentLng })
                }).catch(() => { });
            }
        }, 1000);

        // ========== Map Interactions ==========
        function setupMapInteractions() {
            leafletMap.on('click', function (e) {
                const lat = e.latlng.lat;
                const lng = e.latlng.lng;

                if (routeMode) {
                    const m = L.circleMarker(e.latlng, {
                        radius: 7, color: '#2196F3', fillColor: '#42a5f5',
                        fillOpacity: 0.9, weight: 2
                    }).addTo(leafletMap);
                    routeMarkers.push(m);

                    const latlngs = routeMarkers.map(m => m.getLatLng());
                    if (polyline) leafletMap.removeLayer(polyline);
                    polyline = L.polyline(latlngs, { color: '#f44336', weight: 3 }).addTo(leafletMap);
                    btnStartRoute.style.display = 'block';
                } else {
                    if (marker) leafletMap.removeLayer(marker);
                    marker = L.marker(e.latlng).addTo(leafletMap);
                    sendLocation(lat, lng);
                }
            });
        }

        // ========== Map Search ==========
        const mapSearchInput = document.getElementById('map-search-input');
        const mapSearchResults = document.getElementById('map-search-results');
        let searchTimeout = null;

        mapSearchInput.addEventListener('input', () => {
            clearTimeout(searchTimeout);
            const q = mapSearchInput.value.trim();
            if (q.length < 3) { mapSearchResults.style.display = 'none'; return; }

            searchTimeout = setTimeout(async () => {
                try {
                    const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=6&addressdetails=1`;
                    const res = await fetch(url, { headers: { 'Accept-Language': 'pt-BR,pt;q=0.9' } });
                    const data = await res.json();
                    renderSearchResults(data);
                } catch (e) {
                    mapSearchResults.style.display = 'none';
                }
            }, 500);
        });

        function renderSearchResults(results) {
            mapSearchResults.innerHTML = '';
            if (!results.length) {
                mapSearchResults.innerHTML = '<div class="map-search-result" style="color:#555;cursor:default;">Nenhum resultado encontrado</div>';
                mapSearchResults.style.display = 'block';
                return;
            }
            mapSearchResults.style.display = 'block';
            results.forEach(r => {
                const name = r.address?.city || r.address?.town || r.address?.village || r.address?.county || r.name;
                const country = r.address?.country || '';
                const state = r.address?.state || '';
                const sub = [state, country].filter(Boolean).join(', ');

                const div = document.createElement('div');
                div.className = 'map-search-result';
                div.innerHTML = `<strong>${name}</strong>${sub ? sub : ''}`;
                div.addEventListener('click', () => {
                    const lat = parseFloat(r.lat);
                    const lng = parseFloat(r.lon);
                    if (leafletMap) {
                        leafletMap.flyTo([lat, lng], 14, { duration: 1.2 });
                        if (marker) leafletMap.removeLayer(marker);
                        marker = L.marker([lat, lng]).addTo(leafletMap);
                        sendLocation(lat, lng);
                    }
                    mapSearchInput.value = name;
                    mapSearchResults.style.display = 'none';
                });
                mapSearchResults.appendChild(div);
            });
        }

        mapSearchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') { mapSearchResults.style.display = 'none'; mapSearchInput.blur(); }
        });

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.map-search')) mapSearchResults.style.display = 'none';
        });

        // ========== Route Controls ==========
        btnMode.addEventListener('click', () => {
            routeMode = !routeMode;
            btnMode.innerHTML = routeMode ? '📍 Point Mode' : '📍 Route Mode';
            btnMode.className = routeMode ? 'btn-danger btn-sm' : 'btn-blue btn-sm';
            if (!routeMode) {
                btnStartRoute.style.display = 'none';
                btnStopRoute.style.display = 'none';
                stopRouting();
            }
        });

        btnClear.addEventListener('click', () => {
            if (leafletMap) {
                if (marker) leafletMap.removeLayer(marker);
                routeMarkers.forEach(m => leafletMap.removeLayer(m));
                if (polyline) leafletMap.removeLayer(polyline);
            }
            routeMarkers = [];
            marker = null;
            polyline = null;
            currentLat = null;
            currentLng = null;
            btnStartRoute.style.display = routeMode ? 'block' : 'none';
            stopRouting();
            setStatus('Ready');
        });

        function stopRouting() {
            if (routingInterval) {
                clearInterval(routingInterval);
                routingInterval = null;
                btnStartRoute.style.display = 'block';
                btnStopRoute.style.display = 'none';
                setStatus('Route stopped');
            }
        }

        btnStopRoute.addEventListener('click', stopRouting);

        btnStartRoute.addEventListener('click', () => {
            if (routeMarkers.length < 2) { alert("Add at least 2 points."); return; }

            btnStartRoute.style.display = 'none';
            btnStopRoute.style.display = 'block';

            let idx = 0, step = 0;
            const steps = 20, interval = 500;

            routingInterval = setInterval(() => {
                if (idx >= routeMarkers.length - 1) { stopRouting(); return; }
                const p1 = routeMarkers[idx].getLatLng();
                const p2 = routeMarkers[idx + 1].getLatLng();
                const lat = p1.lat + (p2.lat - p1.lat) * (step / steps);
                const lng = p1.lng + (p2.lng - p1.lng) * (step / steps);

                if (marker && leafletMap) leafletMap.removeLayer(marker);
                if (leafletMap) marker = L.marker([lat, lng]).addTo(leafletMap);
                sendLocation(lat, lng);

                step++;
                if (step >= steps) { step = 0; idx++; }
            }, interval);
        });

        // ========== Touch Interaction ==========
        let deviceWidth = 1080, deviceHeight = 2280;
        let dragStart = null, isDragging = false;

        async function fetchDeviceSize() {
            try {
                const res = await fetch('/device/size');
                const data = await res.json();
                deviceWidth = data.width;
                deviceHeight = data.height;
            } catch (e) { }
        }
        fetchDeviceSize();

        function getDeviceCoords(e) {
            let el, contentW, contentH;
            if (streamCanvas.style.display !== 'none' && streamCanvas.width > 0) {
                el = streamCanvas; contentW = streamCanvas.width; contentH = streamCanvas.height;
            } else if (streamImg.style.display !== 'none' && streamImg.naturalWidth > 0) {
                el = streamImg; contentW = streamImg.naturalWidth; contentH = streamImg.naturalHeight;
            } else {
                return null;
            }

            const rect = el.getBoundingClientRect();
            const aspect = contentW / contentH;
            const containerAspect = rect.width / rect.height;

            let renderW, renderH, offsetX, offsetY;
            if (aspect > containerAspect) {
                renderW = rect.width; renderH = rect.width / aspect;
                offsetX = 0; offsetY = (rect.height - renderH) / 2;
            } else {
                renderH = rect.height; renderW = rect.height * aspect;
                offsetX = (rect.width - renderW) / 2; offsetY = 0;
            }

            const relX = (e.clientX - rect.left - offsetX) / renderW;
            const relY = (e.clientY - rect.top - offsetY) / renderH;
            if (relX < 0 || relX > 1 || relY < 0 || relY > 1) return null;
            return { x: Math.round(relX * deviceWidth), y: Math.round(relY * deviceHeight) };
        }

        function showTouchIndicator(e) {
            const screen = document.getElementById('device-screen');
            const rect = screen.getBoundingClientRect();
            const dot = document.createElement('div');
            dot.className = 'touch-indicator';
            dot.style.left = (e.clientX - rect.left) + 'px';
            dot.style.top = (e.clientY - rect.top) + 'px';
            screen.appendChild(dot);
            setTimeout(() => dot.remove(), 400);
        }

        function sendTouch(action, x, y, x2, y2, duration) {
            fetch('/touch', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action, x, y, x2: x2 || 0, y2: y2 || 0, duration: duration || 300 })
            }).catch(() => { });
        }

        function attachTouchListeners(el) {
            el.addEventListener('mousedown', (e) => {
                e.preventDefault();
                const c = getDeviceCoords(e);
                if (!c) return;
                dragStart = { x: c.x, y: c.y, time: Date.now() };
                isDragging = false;
            });
            el.addEventListener('mousemove', (e) => {
                if (!dragStart) return;
                const c = getDeviceCoords(e);
                if (!c) return;
                if (Math.abs(c.x - dragStart.x) > 20 || Math.abs(c.y - dragStart.y) > 20) isDragging = true;
            });
            el.addEventListener('mouseup', (e) => {
                if (!dragStart) return;
                const c = getDeviceCoords(e);
                if (!c) return;
                if (isDragging) {
                    const dur = Math.min(Date.now() - dragStart.time, 2000);
                    sendTouch('swipe', dragStart.x, dragStart.y, c.x, c.y, Math.max(dur, 100));
                } else {
                    showTouchIndicator(e);
                    sendTouch('tap', c.x, c.y);
                }
                dragStart = null;
                isDragging = false;
            });
            el.addEventListener('mouseleave', () => { dragStart = null; isDragging = false; });
            el.addEventListener('contextmenu', (e) => e.preventDefault());
        }

        attachTouchListeners(streamImg);
        attachTouchListeners(streamCanvas);

        // ========== Navigation Buttons ==========
        document.getElementById('btn-back').addEventListener('click', () => sendTouch('keyevent', 4, 0));
        document.getElementById('btn-home').addEventListener('click', () => sendTouch('keyevent', 3, 0));
        document.getElementById('btn-recent').addEventListener('click', () => sendTouch('keyevent', 187, 0));
    </script>
</body>

</html>
